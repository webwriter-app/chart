stages:
  - test
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - dist/

test:
  stage: test
  image: node:16-alpine
  script:
    - yarn
    - yarn test --run

check-style:
  stage: test
  image: node:16-alpine
  script:
    - yarn
    - yarn check-prettier

deploy-webpage:
  stage: deploy
  image: node:16-alpine
  only:
    - main
  script:
    - yarn
    - yarn build
    - npx netlify-cli deploy --dir=dist --site f71c745a-88c8-458e-8af2-47b7543711bb --auth $NETLIFY_AUTH_TOKEN --prod

deploy-npm:
  stage: deploy
  image: node:16-alpine
  only:
    - main
  script:
    - yarn
    - yarn build
    - npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
    - npm publish --access=public
