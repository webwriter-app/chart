<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Lit + TS</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/widget.ts"></script>
  </head>
  <body>
    <ww-chart id="ww-chart" />
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Get the current URL
      const elmt = document.getElementById("ww-chart");
      if (!elmt) console.log("ww-chart not found");
      const currentURL = window.location.href;

      if (currentURL.endsWith("edit")) {
        elmt.setAttribute("editable", "true");
        elmt.editable = true;
      } else if (currentURL.endsWith("print")) {
        elmt.printable = true;
      } else {
        elmt.editable = false;
        elmt.printable = false;
      }
    });
  </script>
</html>
