<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Lit + TS</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/widget.ts"></script>
  </head>
  <body>
    <div>
      <webwriter-chart id="webwriter-chart" />
    </div>
    <div class="checkbox-container">
      <div style="display: inline-block; margin-right: 10px">
        <input type="checkbox" id="editing" name="editing" value="editing" />
        <label for="editing">Editing</label>
      </div>
      <div style="display: inline-block; margin-right: 0">
        <input type="checkbox" id="printing" name="printing" value="printing" />
        <label for="printing">Printing</label>
      </div>
    </div>
  </body>
  <style>
    .checkbox-container {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.7);
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 5px;
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("editing").addEventListener("change", (event) => {
        const elmt = document.getElementById("webwriter-chart");
        if (!elmt) console.log("webwriter-chart not found");
        if (event.target.checked) {
          elmt.setAttribute("editable", "true");
          elmt.editable = true;
        } else {
          elmt.setAttribute("editable", "false");
          elmt.editable = false;
        }
      });
      document
        .getElementById("printing")
        .addEventListener("change", (event) => {
          const elmt = document.getElementById("webwriter-chart");
          if (!elmt) console.log("webwriter-chart not found");
          if (event.target.checked) {
            elmt.setAttribute("printable", "true");
            elmt.printable = true;
          } else {
            elmt.setAttribute("printable", "false");
            elmt.printable = false;
          }
        });
    });
  </script>
</html>
